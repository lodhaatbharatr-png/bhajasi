<!doctype html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17110d" />
  <meta name="description" content="भजासी — संतवाणी, अभंग, हरिपाठ आणि चिंतनासाठी साधे मराठी वाचनालय." />
  <title>भजासी — संतवाणी • अभंग • हरिनाम</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#120e0b;--panel:#1b1511;--panel2:#221a15;--line:#3b2c23;--gold:#e7ae63;--gold2:#f5c982;--cream:#f4eadc;--muted:#b9a99a;--green:#9bc9a5;--shadow:0 18px 50px rgba(0,0,0,.3)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:radial-gradient(circle at 50% -10%,#332116 0,#120e0b 38%,#0d0a08 100%);color:var(--cream);font-family:'Noto Sans Devanagari',sans-serif} button{font:inherit;color:inherit} .app{min-height:100vh;max-width:760px;margin:auto;padding-bottom:88px}
    header{position:sticky;top:0;z-index:20;background:rgba(18,14,11,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(231,174,99,.14);padding:13px 16px 10px}.brand{display:flex;align-items:center;justify-content:space-between}.brand-main{display:flex;align-items:center;gap:11px}.mark{width:40px;height:40px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:21px}.brand h1{font-family:'Rozha One',serif;font-size:25px;line-height:1;margin:0;color:var(--gold2);font-weight:400}.brand p{margin:4px 0 0;font-size:11px;color:var(--muted);letter-spacing:.5px}.share{width:39px;height:39px;border-radius:50%;border:1px solid #5a4331;background:#211912;cursor:pointer}.share:hover{border-color:var(--gold)}
    nav{display:flex;gap:6px;overflow:auto;margin-top:11px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.nav-btn{white-space:nowrap;border:1px solid var(--line);background:#19130f;border-radius:10px;padding:8px 15px;font-size:13px;color:#bcae9f;cursor:pointer}.nav-btn.active{background:var(--gold);border-color:var(--gold);color:#24170d;font-weight:700}.progress{height:2px;background:#2a211b;margin:10px -16px -10px}.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
    main{padding:18px 15px}.hero{padding:18px 4px 10px}.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1px}.hero h2{font-family:'Rozha One',serif;font-size:32px;font-weight:400;line-height:1.15;margin:5px 0;color:#fff5e8}.hero p{color:var(--muted);font-size:14px;line-height:1.75;margin:8px 0}.search{display:flex;gap:8px;margin:8px 0 18px}.search input{width:100%;background:#19130f;border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--cream);outline:none}.search input:focus{border-color:var(--gold)}
    .section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 10px}.section-title h3{margin:0;font-size:17px}.section-title span{font-size:11px;color:var(--muted)}.saint-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.saint-card{background:linear-gradient(145deg,#211912,#17110e);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:112px;text-align:left;cursor:pointer;transition:.2s;box-shadow:0 5px 20px rgba(0,0,0,.12)}.saint-card:hover{transform:translateY(-1px);border-color:#6c5037}.saint-symbol{color:var(--gold);font-size:18px}.saint-name{font-weight:700;margin-top:7px;font-size:14px}.saint-work{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}.count{display:inline-block;margin-top:8px;font-size:10px;color:var(--green)}
    .reader{display:none}.reader.show{display:block}.reader-head{padding:10px 2px 16px}.back{border:0;background:none;color:var(--gold);padding:0;cursor:pointer;font-size:13px}.reader h2{font-family:'Rozha One',serif;font-size:31px;font-weight:400;margin:13px 0 2px}.reader-meta{color:var(--muted);font-size:12px}.daybar{display:flex;gap:7px;overflow:auto;padding:3px 0 14px;scrollbar-width:none}.daybar::-webkit-scrollbar{display:none}.day{flex:0 0 auto;border:1px solid var(--line);background:#19130f;border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer}.day.active{background:#d99b50;color:#21150d;border-color:#d99b50;font-weight:700}.verse{background:linear-gradient(155deg,#211912,#18120f);border:1px solid #33271f;border-radius:18px;padding:18px 16px;margin:10px 0;box-shadow:var(--shadow)}.verse-no{color:var(--gold);font-size:11px;font-weight:700;margin-bottom:10px}.verse-text{font-family:'Rozha One',serif;font-size:24px;line-height:1.75;color:#fff1de}.meaning{border-top:1px solid #392c23;margin-top:14px;padding-top:13px}.meaning-title{color:var(--gold2);font-size:12px;font-weight:700;margin-bottom:5px}.meaning p{margin:0;color:#d1c2b4;font-size:14px;line-height:1.85}.note{margin-top:10px;color:#a99684;font-size:11px;line-height:1.7}.reader-footer{display:flex;gap:10px;justify-content:space-between;margin-top:16px}.pager{flex:1;border:1px solid var(--line);background:#1b1511;border-radius:12px;padding:11px;cursor:pointer}.pager:disabled{opacity:.35;cursor:default}.pager.next{border-color:#805d3d;background:#241a13}.empty{border:1px dashed var(--line);padding:22px;border-radius:15px;color:var(--muted);text-align:center}.bottom{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:rgba(18,14,11,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(231,174,99,.14);display:flex;justify-content:space-around}.bottom button{border:0;background:none;color:#9e9186;font-size:11px;cursor:pointer}.bottom button.active{color:var(--gold2)}.bottom b{display:block;font-size:18px;font-weight:400;margin-bottom:1px}
    @media(min-width:600px){main{padding:24px}.hero{padding-top:25px}.saint-grid{grid-template-columns:repeat(3,1fr)}.verse{padding:24px}.verse-text{font-size:27px}}
  </style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="brand-main"><div class="mark">॥</div><div><h1>भजासी</h1><p>संतवाणी • अभंग • हरिनाम • चिंतन</p></div></div><button class="share" id="shareBtn" aria-label="Share">↗</button></div><nav id="topNav"></nav><div class="progress"><i id="progress"></i></div></header>
<main>
<section id="homeView">
  <div class="hero"><div class="eyebrow">संत साहित्याचे शांत वाचन</div><h2>शब्द वाचा.<br/>अर्थ समजा. चिंतन करा.</h2><p>संतांच्या साहित्याचा ओळीनुसार अर्थ, दिवसानुसार वाचन आणि साधी, मनःशांत करणारी मांडणी.</p></div>
  <div class="search"><input id="search" placeholder="संत किंवा साहित्य शोधा…" autocomplete="off" /></div>
  <div class="section-title"><h3>संतांची स्वतंत्र ओळख</h3><span id="count"></span></div>
  <div class="saint-grid" id="saintGrid"></div>
</section>
<section id="readerView" class="reader"><div class="reader-head"><button class="back" id="backBtn">← संतांकडे परत</button><h2 id="readerTitle"></h2><div class="reader-meta" id="readerMeta"></div></div><div class="daybar" id="dayBar"></div><div id="verses"></div><div class="reader-footer"><button class="pager" id="prevBtn">← मागील</button><button class="pager next" id="nextBtn">पुढील →</button></div></section>
</main>
<div class="bottom"><button class="active" id="homeBtn"><b>⌂</b>मुख्य</button><button id="saintsBtn"><b>✦</b>संत</button><button id="todayBtn"><b>☀</b>आजचे</button></div>
</div>
<script>
const state={saints:[],activeSaint:null,activeWork:null,day:1,query:''};
const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch('data/saints.json');state.saints=await r.json();renderSaints();renderNav()}catch(e){$('#saintGrid').innerHTML='<div class="empty">साहित्य माहिती लोड करता आली नाही.</div>'}}
function renderNav(){const nav=$('#topNav');nav.innerHTML='<button class="nav-btn active">संत</button><button class="nav-btn" onclick="showHome()">आजचे वाचन</button><button class="nav-btn" onclick="alert(\'जतन सुविधा पुढील आवृत्तीत येत आहे.\')">जतन</button>'}
function renderSaints(){const q=state.query.trim().toLowerCase();const list=state.saints.filter(s=>(s.name+s.search+' '+s.works.map(w=>w.title).join(' ')).toLowerCase().includes(q));$('#count').textContent=list.length+' संत';$('#saintGrid').innerHTML=list.map((s,i)=>`<button class="saint-card" onclick="openSaint('${s.id}')"><div class="saint-symbol">${s.symbol||'॥'}</div><div class="saint-name">${s.name}</div><div class="saint-work">${s.works.map(w=>w.title).join(' • ')}</div><span class="count">${s.works.length} साहित्य</span></button>`).join('')||'<div class="empty">शोधाशी जुळणारे साहित्य सापडले नाही.</div>'}
function openSaint(id){const s=state.saints.find(x=>x.id===id);if(!s)return;state.activeSaint=s;state.activeWork=s.works[0];state.day=1;$('#homeView').style.display='none';$('#readerView').classList.add('show');renderReader();window.scrollTo({top:0,behavior:'smooth'})}
function renderReader(){const s=state.activeSaint,w=state.activeWork;$('#readerTitle').textContent=w.title;$('#readerMeta').textContent=s.name+'  •  '+w.type;const days=Math.max(1,w.days||1);$('#dayBar').innerHTML=Array.from({length:days},(_,i)=>`<button class="day ${i+1===state.day?'active':''}" onclick="setDay(${i+1})">दिवस ${i+1}</button>`).join('');const entries=w.entries.filter(e=>!e.day||e.day===state.day);$('#verses').innerHTML=entries.length?entries.map((e,i)=>`<article class="verse"><div class="verse-no">ओळ ${i+1}</div><div class="verse-text">${e.text}</div><div class="meaning"><div class="meaning-title">अर्थ</div><p>${e.meaning}</p></div>${e.note?`<div class="note">टीप · ${e.note}</div>`:''}</article>`).join(''):'<div class="empty">या दिवसाचे सविस्तर वाचन लवकरच जोडले जाईल.</div>';$('#prevBtn').disabled=state.day<=1;$('#nextBtn').disabled=state.day>=days;window.scrollTo({top:0,behavior:'smooth'})}
function setDay(d){state.day=d;renderReader()}
function showHome(){state.activeSaint=null;$('#readerView').classList.remove('show');$('#homeView').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
$('#backBtn').onclick=showHome;$('#homeBtn').onclick=showHome;$('#saintsBtn').onclick=showHome;$('#todayBtn').onclick=()=>{const first=state.saints[0];if(first)openSaint(first.id)};$('#search').oninput=e=>{state.query=e.target.value;renderSaints()};$('#prevBtn').onclick=()=>state.day>1&&setDay(state.day-1);$('#nextBtn').onclick=()=>state.day<state.activeWork.days&&setDay(state.day+1);$('#shareBtn').onclick=async()=>{const text=state.activeWork?`भजासी — ${state.activeWork.title}`:'भजासी — संतवाणी';try{await navigator.share({title:'भजासी',text,url:location.href})}catch{try{await navigator.clipboard.writeText(location.href);alert('लिंक कॉपी झाला.')}catch{}}};window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;$('#progress').style.width=(h>0?(scrollY/h)*100:0)+'%' });load();
</script>
</body></html>
