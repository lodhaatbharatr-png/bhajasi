<!doctype html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#120e0b" />
<meta name="description" content="भजासी — संतवाणीचे शांत वाचन, ओळीनुसार अर्थ आणि दिवसानुसार साधना." />
<title>भजासी — संतवाणी</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#120e0b;--panel:#1b1511;--line:#382a21;--gold:#e7ae63;--gold2:#f4c47d;--cream:#f4eadc;--muted:#ad9d8e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#2d1d13 0,#120e0b 38%,#0d0a08 100%);color:var(--cream);font-family:'Noto Sans Devanagari',sans-serif}.app{min-height:100vh;max-width:760px;margin:auto;padding-bottom:72px}
header{position:sticky;top:0;z-index:20;background:rgba(18,14,11,.97);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,174,99,.12);padding:10px 17px 9px}.brandline{display:flex;align-items:center;justify-content:space-between;gap:14px}.brandline h1{font-size:25px;line-height:1;margin:0;color:var(--gold2);font-weight:800;white-space:nowrap}.brandline span{font-size:10px;color:var(--muted);white-space:nowrap}.credit{margin-top:3px;font-size:9px;color:#89796b}.top-progress{height:2px;background:#292019;margin:8px -17px -9px}.top-progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
main{padding:12px 16px 24px}.search{margin:4px 0 16px}.search input{width:100%;background:#17110e;border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--cream);outline:none;font-size:14px;font-family:inherit}.search input:focus{border-color:var(--gold)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 10px}.section-title h3{margin:0;font-size:16px;font-weight:800}.section-title span{font-size:10px;color:var(--muted)}.saint-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.saint-card,.work-card{width:100%;text-align:left;background:linear-gradient(145deg,#211912,#17110e);border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;color:var(--cream);font-family:inherit}.saint-card{min-height:74px}.saint-card:hover,.work-card:hover{border-color:#694d34}.saint-name{font-size:15px;font-weight:800}.saint-work{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.55}
.reader{display:none}.reader.show{display:block}.reader-head{padding:1px 1px 14px}.back{display:inline-block;border:0;background:none;color:var(--gold);padding:1px 0 8px;cursor:pointer;font-size:12px;font-family:inherit}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.reader h2{font-size:25px;font-weight:800;line-height:1.25;margin:0;color:#fff5e8}.day-label{font-size:11px;color:var(--gold2);white-space:nowrap;padding-bottom:2px}.reader-meta{display:none}.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:3px}.work-card h3{margin:0;font-size:16px;font-weight:800}.work-card p,.work-card span{display:none}
.day-progress{margin:0 0 13px}.day-track{display:grid;grid-template-columns:repeat(var(--days),1fr);gap:3px}.day-segment{height:3px;border-radius:8px;background:#33271f}.day-segment.done{background:var(--gold)}
.verse{background:linear-gradient(155deg,#211912,#18120f);border:1px solid #33271f;border-radius:16px;padding:15px 14px;margin:9px 0}.verse-text{font-size:18px;line-height:1.72;font-weight:700;color:#fff1de;text-align:center}.verse-text br{line-height:2.05}.meaning{border-top:1px solid #392c23;margin-top:12px;padding-top:10px;text-align:left}.meaning-title{color:var(--gold2);font-size:10px;font-weight:800;margin-bottom:3px}.meaning p{margin:0;color:#cdbfb1;font-size:13px;line-height:1.75}.reader-footer{display:flex;justify-content:space-between;margin-top:11px}.pager{width:38px;height:38px;border:1px solid var(--line);background:#1b1511;color:var(--gold2);border-radius:11px;font-family:inherit;font-size:20px;line-height:1;cursor:pointer}.pager:disabled{opacity:.22;cursor:default}.empty{border:1px dashed var(--line);padding:18px;border-radius:14px;color:var(--muted);text-align:center;font-size:13px}.bottom{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:7px 14px calc(7px + env(safe-area-inset-bottom));background:rgba(18,14,11,.98);backdrop-filter:blur(14px);border-top:1px solid rgba(231,174,99,.13);display:flex;justify-content:space-around}.bottom button{border:0;background:none;color:#9e9186;font-family:inherit;font-size:10px;cursor:pointer}.bottom button.active{color:var(--gold2)}.bottom b{display:block;font-size:17px;font-weight:500;margin-bottom:0}
@media(min-width:600px){main{padding:15px 25px 28px}.saint-grid{grid-template-columns:repeat(3,1fr)}.verse{padding:18px 20px}.verse-text{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brandline"><h1>भजासी</h1><span>संतवाणी • अभंग • हरिनाम • चिंतन</span></div>
  <div class="credit">संकलन: भरत रास्वे</div>
  <div class="top-progress"><i id="progress"></i></div>
</header>
<main>
<section id="homeView">
  <div class="search"><input id="search" placeholder="संत किंवा साहित्य शोधा…" autocomplete="off"></div>
  <div class="section-title"><h3>संत</h3><span id="count"></span></div>
  <div class="saint-grid" id="saintGrid"></div>
</section>
<section id="worksView" class="reader">
  <div class="reader-head"><button class="back" id="worksBack">← संतांकडे परत</button><div class="title-row"><h2 id="saintTitle"></h2></div></div>
  <div class="work-grid" id="workGrid"></div>
</section>
<section id="readerView" class="reader">
  <div class="reader-head"><button class="back" id="readerBack">← साहित्याकडे परत</button><div class="day-progress" id="dayProgress"></div><div class="title-row"><h2 id="readerTitle"></h2><span class="day-label" id="dayLabel"></span></div></div>
  <div id="verses"></div>
  <div class="reader-footer"><button class="pager" id="prevBtn" aria-label="मागील दिवस">←</button><button class="pager" id="nextBtn" aria-label="पुढील दिवस">→</button></div>
</section>
</main>
<div class="bottom"><button class="active" id="homeBtn"><b>⌂</b>मुख्य</button><button id="saintsBtn"><b>✦</b>संत</button><button id="todayBtn"><b>☀</b>आजचे</button></div>
</div>
<script>
const state={saints:[],activeSaint:null,activeWork:null,day:1,query:''};
const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch('data/saints.json');state.saints=await r.json();renderSaints()}catch(e){$('#saintGrid').innerHTML='<div class="empty">साहित्य माहिती लोड करता आली नाही.</div>'}}
function renderSaints(){const q=state.query.trim().toLowerCase();const list=state.saints.filter(s=>(s.name+' '+(s.search||'')+' '+s.works.map(w=>w.title).join(' ')).toLowerCase().includes(q));$('#count').textContent=list.length+' संत';$('#saintGrid').innerHTML=list.map(s=>`<button class="saint-card" onclick="openSaint('${s.id}')"><div class="saint-name">${s.name}</div><div class="saint-work">${s.works.map(w=>w.title).join(' • ')}</div></button>`).join('')||'<div class="empty">शोधाशी जुळणारे साहित्य सापडले नाही.</div>'}
function hideViews(){['homeView','worksView','readerView'].forEach(id=>$('#'+id).style.display='none');['worksView','readerView'].forEach(id=>$('#'+id).classList.remove('show'))}
function openSaint(id){const s=state.saints.find(x=>x.id===id);if(!s)return;state.activeSaint=s;hideViews();$('#worksView').style.display='block';$('#worksView').classList.add('show');$('#saintTitle').textContent=s.name;$('#workGrid').innerHTML=s.works.map((w,i)=>`<button class="work-card" onclick="openWork(${i})"><h3>${w.title}</h3></button>`).join('');window.scrollTo({top:0,behavior:'smooth'})}
function splitPoem(text){return String(text||'').replace(/\s*(।|॥|\.)\s*/g,'$1<br>')}</nfunction openWork(index){state.activeWork=state.activeSaint.works[index];state.day=1;hideViews();$('#readerView').style.display='block';$('#readerView').classList.add('show');renderReader()}
function renderReader(){const w=state.activeWork,days=Math.max(1,w.days||1);$('#readerTitle').textContent=w.title;$('#dayLabel').textContent='दिवस '+state.day;$('#dayProgress').style.setProperty('--days',days);$('#dayProgress').innerHTML=`<div class="day-track">${Array.from({length:days},(_,i)=>`<i class="day-segment ${i<state.day?'done':''}"></i>`).join('')}</div>`;const entries=w.entries.filter(e=>!e.day||e.day===state.day);$('#verses').innerHTML=entries.length?entries.map(e=>`<article class="verse"><div class="verse-text">${splitPoem(e.text)}</div><div class="meaning"><div class="meaning-title">अर्थ</div><p>${e.meaning}</p></div></article>`).join(''):'<div class="empty">या दिवसाचे वाचन लवकरच जोडले जाईल.</div>';$('#prevBtn').disabled=state.day<=1;$('#nextBtn').disabled=state.day>=days;window.scrollTo({top:0,behavior:'smooth'})}
function setDay(d){if(!state.activeWork)return;const days=Math.max(1,state.activeWork.days||1);if(d<1||d>days)return;state.day=d;renderReader()}
function showHome(){state.activeSaint=null;state.activeWork=null;hideViews();$('#homeView').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
$('#worksBack').onclick=()=>showHome();$('#readerBack').onclick=()=>openSaint(state.activeSaint.id);$('#homeBtn').onclick=showHome;$('#saintsBtn').onclick=showHome;$('#todayBtn').onclick=()=>{const first=state.saints[0];if(first)openSaint(first.id)};$('#search').oninput=e=>{state.query=e.target.value;renderSaints()};$('#prevBtn').onclick=()=>setDay(state.day-1);$('#nextBtn').onclick=()=>setDay(state.day+1);
let touchStartX=0,touchStartY=0;document.addEventListener('touchstart',e=>{if(!$('#readerView').classList.contains('show'))return;const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});document.addEventListener('touchend',e=>{if(!$('#readerView').classList.contains('show'))return;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.35){if(dx<0)setDay(state.day+1);else setDay(state.day-1)}},{passive:true});
window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;$('#progress').style.width=(h>0?(scrollY/h)*100:0)+'%'});load();
</script>
</body>
</html>
