<!doctype html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#120e0b" />
<meta name="description" content="भजासी — संतसाहित्याचे शांत वाचन, ओळीनुसार अर्थ आणि दिवसानुसार साधना." />
<title>भजासी — संतसाहित्य</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#120e0b;--panel:#1b1511;--panel2:#211912;--line:#382a21;--gold:#e7ae63;--gold2:#f4c47d;--cream:#f4eadc;--muted:#ad9d8e;--green:#9bc9a5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#2d1d13 0,#120e0b 38%,#0d0a08 100%);color:var(--cream);font-family:'Noto Sans Devanagari',sans-serif}.app{min-height:100vh;max-width:760px;margin:auto;padding-bottom:78px}
header{position:sticky;top:0;z-index:20;background:rgba(18,14,11,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,174,99,.13);padding:15px 18px 12px}.brand{display:flex;align-items:center}.brand h1{font-size:25px;line-height:1;margin:0;color:var(--gold2);font-weight:800}.brand p{margin:4px 0 0;font-size:11px;color:var(--muted);letter-spacing:.25px}.progress{height:2px;background:#292019;margin:12px -18px -12px}.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
main{padding:20px 16px}.hero{padding:22px 4px 13px}.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.6px}.hero h2{font-size:29px;font-weight:800;line-height:1.35;margin:5px 0 8px;color:#fff5e8}.hero p{color:var(--muted);font-size:13px;line-height:1.7;margin:0}.search{margin:10px 0 20px}.search input{width:100%;background:#17110e;border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--cream);outline:none;font-size:14px}.search input:focus{border-color:var(--gold)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px}.section-title h3{margin:0;font-size:17px;font-weight:800}.section-title span{font-size:11px;color:var(--muted)}.saint-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.saint-card,.work-card{width:100%;text-align:left;background:linear-gradient(145deg,#211912,#17110e);border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;color:var(--cream);font-family:inherit}.saint-card{min-height:100px}.saint-card:hover,.work-card:hover{border-color:#694d34}.saint-name{font-size:15px;font-weight:800}.saint-work{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}.work-count{font-size:10px;color:var(--green);margin-top:7px}
.reader{display:none}.reader.show{display:block}.back{border:0;background:none;color:var(--gold);padding:0;cursor:pointer;font-size:13px;font-family:inherit}.reader-head{padding:8px 2px 16px}.reader h2{font-size:27px;font-weight:800;line-height:1.3;margin:13px 0 2px}.reader-meta{color:var(--muted);font-size:12px}.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.work-card h3{margin:0;font-size:16px;font-weight:800}.work-card p{margin:5px 0 0;color:var(--muted);font-size:11px}.work-card span{display:block;margin-top:10px;color:var(--green);font-size:10px}
.day-progress{margin:2px 0 18px}.day-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}.day-row strong{color:var(--gold2);font-weight:700}.day-track{display:grid;grid-template-columns:repeat(var(--days),1fr);gap:4px}.day-segment{height:4px;border-radius:8px;background:#33271f}.day-segment.done,.day-segment.current{background:var(--gold)}
.verse{background:linear-gradient(155deg,#211912,#18120f);border:1px solid #33271f;border-radius:17px;padding:17px 15px;margin:10px 0}.verse-text{font-size:20px;line-height:1.7;font-weight:700;color:#fff1de}.meaning{border-top:1px solid #392c23;margin-top:13px;padding-top:12px}.meaning-title{color:var(--gold2);font-size:11px;font-weight:800;margin-bottom:4px}.meaning p{margin:0;color:#cdbfb1;font-size:13px;line-height:1.8}.note{margin-top:9px;color:#988777;font-size:10px;line-height:1.65}.reader-footer{display:flex;gap:9px;margin-top:14px}.pager{flex:1;border:1px solid var(--line);background:#1b1511;color:var(--cream);border-radius:11px;padding:10px;font-family:inherit;font-size:12px;cursor:pointer}.pager.next{border-color:#745334;background:#241a13}.pager:disabled{opacity:.3;cursor:default}.empty{border:1px dashed var(--line);padding:20px;border-radius:14px;color:var(--muted);text-align:center;font-size:13px}.bottom{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(18,14,11,.97);backdrop-filter:blur(14px);border-top:1px solid rgba(231,174,99,.13);display:flex;justify-content:space-around}.bottom button{border:0;background:none;color:#9e9186;font-family:inherit;font-size:10px;cursor:pointer}.bottom button.active{color:var(--gold2)}.bottom b{display:block;font-size:17px;font-weight:500;margin-bottom:1px}
@media(min-width:600px){main{padding:25px}.hero{padding-top:28px}.saint-grid{grid-template-columns:repeat(3,1fr)}.verse{padding:21px}.verse-text{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div><h1>भजासी</h1><p>संतवाणी • अभंग • हरिनाम • चिंतन</p></div></div><div class="progress"><i id="progress"></i></div></header>
<main>
<section id="homeView">
<div class="hero"><div class="eyebrow">संत साहित्याचे शांत वाचन</div><h2>शब्द वाचा.<br>अर्थ समजा. चिंतन करा.</h2><p>संतांच्या साहित्याचा ओळीनुसार अर्थ, दिवसानुसार वाचन आणि साधी, मनःशांत करणारी मांडणी.</p></div>
<div class="search"><input id="search" placeholder="संत किंवा साहित्य शोधा…" autocomplete="off"></div>
<div class="section-title"><h3>संत</h3><span id="count"></span></div>
<div class="saint-grid" id="saintGrid"></div>
</section>
<section id="worksView" class="reader"><div class="reader-head"><button class="back" id="worksBack">← संतांकडे परत</button><h2 id="saintTitle"></h2><div class="reader-meta">साहित्य निवडा</div></div><div class="work-grid" id="workGrid"></div></section>
<section id="readerView" class="reader"><div class="reader-head"><button class="back" id="readerBack">← साहित्याकडे परत</button><h2 id="readerTitle"></h2><div class="reader-meta" id="readerMeta"></div></div><div class="day-progress" id="dayProgress"></div><div id="verses"></div><div class="reader-footer"><button class="pager" id="prevBtn">← मागील दिवस</button><button class="pager next" id="nextBtn">पुढील दिवस →</button></div></section>
</main>
<div class="bottom"><button class="active" id="homeBtn"><b>⌂</b>मुख्य</button><button id="saintsBtn"><b>✦</b>संत</button><button id="todayBtn"><b>☀</b>आजचे</button></div>
</div>
<script>
const state={saints:[],activeSaint:null,activeWork:null,day:1,query:''};
const $=s=>document.querySelector(s);
async function load(){try{const r=await fetch('data/saints.json');state.saints=await r.json();renderSaints()}catch(e){$('#saintGrid').innerHTML='<div class="empty">साहित्य माहिती लोड करता आली नाही.</div>'}}
function renderSaints(){const q=state.query.trim().toLowerCase();const list=state.saints.filter(s=>(s.name+' '+(s.search||'')+' '+s.works.map(w=>w.title).join(' ')).toLowerCase().includes(q));$('#count').textContent=list.length+' संत';$('#saintGrid').innerHTML=list.map(s=>`<button class="saint-card" onclick="openSaint('${s.id}')"><div class="saint-name">${s.name}</div><div class="saint-work">${s.works.map(w=>w.title).join(' • ')}</div><div class="work-count">${s.works.length} साहित्य</div></button>`).join('')||'<div class="empty">शोधाशी जुळणारे साहित्य सापडले नाही.</div>'}
function hideViews(){['homeView','worksView','readerView'].forEach(id=>$('#'+id).style.display='none');['worksView','readerView'].forEach(id=>$('#'+id).classList.remove('show'))}
function openSaint(id){const s=state.saints.find(x=>x.id===id);if(!s)return;state.activeSaint=s;hideViews();$('#worksView').style.display='block';$('#worksView').classList.add('show');$('#saintTitle').textContent=s.name;$('#workGrid').innerHTML=s.works.map((w,i)=>`<button class="work-card" onclick="openWork(${i})"><h3>${w.title}</h3><p>${w.type||'साहित्य'}</p><span>${w.days&&w.days>1?w.days+' दिवसांचे वाचन':'वाचन'}</span></button>`).join('');window.scrollTo({top:0,behavior:'smooth'})}
function openWork(index){state.activeWork=state.activeSaint.works[index];state.day=1;hideViews();$('#readerView').style.display='block';$('#readerView').classList.add('show');renderReader()}
function renderReader(){const s=state.activeSaint,w=state.activeWork,days=Math.max(1,w.days||1);$('#readerTitle').textContent=w.title;$('#readerMeta').textContent=s.name+(w.type?' • '+w.type:'');$('#dayProgress').style.setProperty('--days',days);$('#dayProgress').innerHTML=`<div class="day-row"><strong>दिवस ${state.day}</strong><span>${days} दिवस</span></div><div class="day-track">${Array.from({length:days},(_,i)=>`<i class="day-segment ${i<state.day?'done':''}"></i>`).join('')}</div>`;const entries=w.entries.filter(e=>!e.day||e.day===state.day);$('#verses').innerHTML=entries.length?entries.map(e=>`<article class="verse"><div class="verse-text">${e.text}</div><div class="meaning"><div class="meaning-title">अर्थ</div><p>${e.meaning}</p></div>${e.note?`<div class="note">टीप · ${e.note}</div>`:''}</article>`).join(''):'<div class="empty">या दिवसाचे वाचन लवकरच जोडले जाईल.</div>';$('#prevBtn').disabled=state.day<=1;$('#nextBtn').disabled=state.day>=days;window.scrollTo({top:0,behavior:'smooth'})}
function setDay(d){state.day=d;renderReader()}
function showHome(){state.activeSaint=null;state.activeWork=null;hideViews();$('#homeView').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
$('#worksBack').onclick=()=>openSaint(state.activeSaint.id);$('#readerBack').onclick=()=>openSaint(state.activeSaint.id);$('#homeBtn').onclick=showHome;$('#saintsBtn').onclick=showHome;$('#todayBtn').onclick=()=>{const first=state.saints[0];if(first)openSaint(first.id)};$('#search').oninput=e=>{state.query=e.target.value;renderSaints()};$('#prevBtn').onclick=()=>state.day>1&&setDay(state.day-1);$('#nextBtn').onclick=()=>state.day<state.activeWork.days&&setDay(state.day+1);window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;$('#progress').style.width=(h>0?(scrollY/h)*100:0)+'%'});load();
</script>
</body>
</html>
