<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    background:
        radial-gradient(
            circle at 50% -10%,
            #41436A 0%,
            #2a3950 45%,
            #151d2a 100%
        );
    color: #ffffff;
    font-family: 'Noto Sans Devanagari', sans-serif;
    min-height: 100vh;
}

body, button, input {
    font-family: 'Noto Sans Devanagari', sans-serif;
}

button {
    -webkit-tap-highlight-color: transparent;
}

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: #1a2332;
}

::-webkit-scrollbar-thumb {
    background: #41436A;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #e98006;
}

#Blog1, .blog-posts, .blog-pager, .blog-feeds, .post-outer, .widget {
    display: none !important;
}

.seo-crawler-indexing {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
}

.bhajasi-root {
    min-height: 100vh;
}

.bhajasi-app {
    min-height: 100vh;
    max-width: 760px;
    margin: auto;
    padding-bottom: 78px;
}

/* Header */
.bhajasi-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(42, 57, 80, 0.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(233, 128, 6, 0.25);
    padding: 9px 15px;
}

.bhajasi-brandline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.bhajasi-brand-container {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.bhajasi-header-logo {
    width: 38px;
    height: 38px;
    min-width: 38px;
    min-height: 38px;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
}

.bhajasi-brand-group {
    display: flex;
    flex-direction: column;
}

/* Brand heading with Gold Gradient */
.bhajasi-brand-wrapper {
    display: inline-flex;
    align-items: flex-end;
    gap: 3px;
    line-height: 1;
}

.bhajasi-brand {
    margin: 0;
    font-family: 'Rozha One', serif;
    font-size: 25px;
    line-height: 1.1;
    font-weight: 400;
    letter-spacing: 0.5px;
    white-space: nowrap;
    background: linear-gradient(135deg, #fbd52d 0%, #e98006 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-domain {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    opacity: 0.9;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}

.bhajasi-tagline {
    color: #cbd5e1;
    font-size: 10.5px;
    margin-top: 2px;
    white-space: nowrap;
}

.bhajasi-action-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
}

.bhajasi-credit {
    color: #cbd5e1;
    font-size: 10px;
    font-weight: 600;
}

.bhajasi-social-btns {
    display: flex;
    align-items: center;
    gap: 6px;
}

.bhajasi-header-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 600;
    border: 1px solid rgba(233, 128, 6, 0.4);
    background: rgba(65, 67, 106, 0.7);
    color: #fbd52d;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
}

.bhajasi-header-btn:hover {
    background: #e98006;
    color: #2a3950;
}

.bhajasi-whatsapp-btn {
    border-color: rgba(37, 211, 102, 0.35);
    background: rgba(37, 211, 102, 0.12);
    color: #25d366;
}

.bhajasi-whatsapp-btn:hover {
    background: #25d366;
    color: #ffffff;
}

.bhajasi-progress {
    height: 2.5px;
    background: #1a2332;
    margin: 8px -15px -9px;
}

.bhajasi-progress-bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #fbd52d, #e98006);
    transition: width .25s ease;
}

.bhajasi-main {
    padding: 13px 16px 20px;
}

/* Sections */
.bhajasi-section {
    margin-bottom: 24px;
    border-radius: 18px;
    padding: 14px;
    border: 1px solid transparent;
}

.bhajasi-section-saints {
    background: rgba(30, 42, 60, 0.75);
    border-color: rgba(65, 67, 106, 0.95);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
}

.bhajasi-section-works {
    background: rgba(152, 64, 99, 0.24);
    border-color: rgba(152, 64, 99, 0.65);
}

.bhajasi-section-themes {
    background: rgba(48, 197, 173, 0.12);
    border-color: rgba(48, 197, 173, 0.45);
}

.bhajasi-section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 4px 12px;
}

.bhajasi-section-title h2,
.bhajasi-section-title h3 {
    margin: 0;
    font-family: 'Tiro Devanagari Marathi', serif;
    font-size: 20px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: 0.02em;
}

/* Search */
.bhajasi-search-wrapper {
    position: relative;
    margin: 4px 0 19px;
}

.bhajasi-search-box {
    position: relative;
    display: flex;
    align-items: center;
}

.bhajasi-search-box input {
    width: 100%;
    background: rgba(26, 35, 50, 0.95);
    border: 1px solid rgba(65, 67, 106, 0.8);
    border-radius: 12px;
    padding: 11px 40px 11px 14px;
    color: #ffffff;
    outline: none;
    font-size: 14px;
    transition: border-color .2s;
}

.bhajasi-search-box input:focus {
    border-color: #e98006;
    box-shadow: 0 0 0 2px rgba(233, 128, 6, 0.25);
}

.bhajasi-search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #cbd5e1;
    cursor: pointer;
    font-size: 15px;
    padding: 4px;
    line-height: 1;
}

.bhajasi-search-clear:hover {
    color: #e98006;
}

.bhajasi-search-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 60;
    background: #1a2332;
    border: 1px solid #41436A;
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,.8);
    max-height: 380px;
    overflow-y: auto;
    padding: 6px;
}

.bhajasi-dropdown-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(65, 67, 106, 0.4);
    padding: 10px 12px;
    color: #ffffff;
    cursor: pointer;
    border-radius: 8px;
    transition: background .2s;
}

.bhajasi-dropdown-item:last-child {
    border-bottom: none;
}

.bhajasi-dropdown-item:hover {
    background: rgba(65, 67, 106, 0.5);
}

.bhajasi-dropdown-title {
    font-family: 'Khand', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: #e98006;
    letter-spacing: 0.02em;
}

.bhajasi-dropdown-match {
    font-size: 12px;
    color: #cbd5e1;
    line-height: 1.5;
    font-family: 'Hind', sans-serif;
}

.bhajasi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.bhajasi-card {
    width: 100%;
    text-align: left;
    background: linear-gradient(145deg, #2a3950, #1c2738);
    border: 1px solid rgba(65, 67, 106, 0.8);
    border-radius: 15px;
    padding: 14px;
    cursor: pointer;
    color: #ffffff;
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
}

.bhajasi-card:hover {
    border-color: #e98006;
    transform: translateY(-2px);
    background: linear-gradient(145deg, #324460, #222f44);
}

.bhajasi-card-title {
    font-family: 'Khand', sans-serif;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.35;
    color: #ffffff;
    letter-spacing: 0.02em;
}

.bhajasi-card-sub {
    margin-top: 4px;
    color: #cbd5e1;
    font-size: 11px;
    line-height: 1.5;
    font-family: 'Noto Sans Devanagari', sans-serif;
}

.bhajasi-saint-card { min-height: 72px; }
.bhajasi-work-card { min-height: 76px; }
.bhajasi-theme-card { min-height: 70px; }

.bhajasi-empty {
    grid-column: 1 / -1;
    border: 1px dashed rgba(233, 128, 6, 0.35);
    border-radius: 14px;
    padding: 22px;
    color: #cbd5e1;
    text-align: center;
    font-size: 13.5px;
    background: rgba(26, 35, 50, 0.4);
}

.bhajasi-reader-head {
    padding: 1px 1px 14px;
}

.bhajasi-reader-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
}

.bhajasi-back {
    border: 0;
    background: transparent;
    color: #e98006;
    padding: 0;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.bhajasi-day-label {
    color: #e98006;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    font-family: 'Noto Sans Devanagari', sans-serif;
}

.bhajasi-title-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
}

.bhajasi-title {
    margin: 0;
    color: #ffffff;
    font-family: 'Tiro Devanagari Marathi', serif;
    font-size: 26px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: 0.015em;
}

/* Verse Card */
.bhajasi-verse {
    position: relative;
    background: linear-gradient(155deg, #2a3950, #1b2535);
    border: 1px solid rgba(65, 67, 106, 0.7);
    border-radius: 16px;
    padding: 16px 14px 14px;
    margin: 12px 0;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
}

.bhajasi-verse-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
}

/* Updated Verse Badge Color: #fcffcd */
.bhajasi-verse-badge {
    font-size: 12px;
    font-weight: 700;
    color: #fcffcd;
    font-family: 'Tiro Devanagari Marathi', serif;
    letter-spacing: 0.03em;
}

.bhajasi-verse-wa-btn {
    border: 1px solid rgba(37, 211, 102, 0.45);
    background: rgba(37, 211, 102, 0.12);
    color: #25d366;
    border-radius: 99px;
    padding: 3px 9px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s ease;
}

.bhajasi-verse-wa-btn:hover {
    background: #25d366;
    color: #ffffff;
    transform: scale(1.02);
}

/* Verse text font: Hind with reduced gap */
.bhajasi-verse-text {
    color: #ffffff;
    text-align: center;
    font-family: 'Hind', 'Noto Sans Devanagari', sans-serif;
    font-size: 17.5px;
    line-height: 1.8;
    font-weight: 600;
}

.bhajasi-verse-line {
    display: block;
    margin: 2px 0;
    padding: 0;
}

.bhajasi-meaning {
    border-top: 1px solid rgba(65, 67, 106, 0.6);
    margin-top: 12px;
    padding-top: 10px;
    text-align: left;
}

/* Updated Meaning Title Color: #a0ea90 */
.bhajasi-meaning-title {
    font-family: 'Noto Serif Devanagari', serif;
    color: #a0ea90;
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 0.02em;
}

.bhajasi-meaning-text {
    margin: 0;
    color: #cbd5e1;
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 13.5px;
    line-height: 1.8;
    font-weight: 400;
}

.bhajasi-teaching {
    border-top: 1px dashed rgba(48, 197, 173, 0.35);
    margin-top: 10px;
    padding-top: 8px;
    text-align: left;
}

/* Updated Teaching Title Color: #30c5ad */
.bhajasi-teaching-title {
    font-family: 'Noto Serif Devanagari', serif;
    color: #30c5ad;
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 3px;
    letter-spacing: 0.02em;
}

/* Teaching text font: Playpen Sans */
.bhajasi-teaching-text {
    margin: 0;
    color: #f1f5f9;
    font-family: 'Playpen Sans', 'Noto Sans Devanagari', cursive, sans-serif;
    font-size: 13px;
    line-height: 1.8;
    font-weight: 500;
}

.bhajasi-reader-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
}

.bhajasi-pager {
    width: 44px;
    height: 44px;
    border: 1px solid rgba(65, 67, 106, 0.8);
    background: #1c2738;
    color: #e98006;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.bhajasi-pager:hover:not(:disabled) {
    border-color: #e98006;
    background: #41436A;
    color: #ffffff;
}

.bhajasi-pager:disabled {
    opacity: .25;
    cursor: default;
}

.bhajasi-continue-list {
    display: grid;
    gap: 8px;
}

.bhajasi-continue-card {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid rgba(65, 67, 106, 0.8);
    border-radius: 14px;
    background: linear-gradient(145deg, #2a3950, #1c2738);
    color: #ffffff;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
}

.bhajasi-continue-card:hover {
    border-color: #e98006;
    transform: translateY(-1px);
}

.bhajasi-continue-main { min-width: 0; }
.bhajasi-continue-saint { color: #e98006; font-size: 10px; font-weight: 700; }
.bhajasi-continue-work { color: #ffffff; font-size: 15px; font-weight: 600; font-family: 'Khand', sans-serif; }
.bhajasi-continue-day { color: #cbd5e1; font-size: 10px; white-space: nowrap; }

/* Page Footer */
.bhajasi-page-footer {
    width: 100%;
    margin-top: 30px;
    padding: 16px 14px 22px;
    text-align: center;
    border-top: 1px solid rgba(233, 128, 6, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.bhajasi-footer-inner {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #e2e8f0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
}

.bhajasi-footer-logo {
    width: 20px;
    height: 20px;
    object-fit: contain;
    border-radius: 50%;
}

.bhajasi-footer-sub {
    font-size: 10px;
    color: #94a3b8;
}

/* Bottom Navigation */
.bhajasi-bottom {
    position: fixed;
    z-index: 60;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(760px,100%);
    padding: 7px 14px calc(7px + env(safe-area-inset-bottom));
    background: rgba(26, 35, 50, 0.98);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(233, 128, 6, 0.2);
    display: flex;
    justify-content: space-around;
}

.bhajasi-bottom button {
    border: 0;
    background: transparent;
    color: #94a3b8;
    font-size: 10px;
    cursor: pointer;
}

.bhajasi-bottom button.active {
    color: #e98006;
    font-weight: 700;
}

.bhajasi-bottom-icon {
    display: block;
    font-size: 16px;
    margin-bottom: 2px;
}

@media (min-width: 600px) {

<script type="text/babel">
//<![CDATA[
const DATA_BASE =

function readProgress() {
    try {
        return JSON.parse(

        );
    } catch {

    }
}

function writeProgress(key, value) {
    const old = readProgress();
    old[key] = {
        ...(old[key] || {}),
        ...value
    };
    localStorage.setItem(
        PROGRESS_KEY,

}

function makeWorkKey(saint, work) {

}

function toMarathiDigits(num) {
    if (num === null || num === undefined) return '';
    const devDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
    return String(num).replace(/[0-9]/g, d => devDigits[d]);
}

// Extract exact number without pipe marks
function getVerseLabel(entry, index) {
    if (!entry) return '';
    let numStr = '';
    if (entry.number !== undefined && entry.number !== null) {
        numStr = toMarathiDigits(entry.number);
    } else if (entry.id) {
        const matches = String(entry.id).match(/(\d+)$/);
        if (matches && matches[1]) {
            numStr = toMarathiDigits(parseInt(matches[1], 10));
        }
    }
    if (!numStr) {
        const textMatch = String(entry.text || '').match(/॥\s*([०-९0-9]+)\s*॥/u);
        if (textMatch && textMatch[1]) {
            numStr = toMarathiDigits(textMatch[1]);
        } else {
            numStr = toMarathiDigits(index + 1);
        }
    }
    return `ओवी ${numStr}`;
}

/* -------------------------------------------------------
   OVI & ABHANG FORMATTER (Clean 2-line structure)
------------------------------------------------------- */
function splitPoem(text) {
    if (!text) return [];

    const normalized = String(text)
        .replace(/\r\n/g, '\n')
        .replace(/॥\s*\n+\s*([०-९0-9]+(?:-[०-९0-9]+)?\s*॥)/gu, '॥ $1')
        .trim();

    if (normalized.includes('\n')) {
        const rawLines = normalized
            .split('\n')
            .map(l => l.trim())
            .filter(Boolean);

        const formattedLines = [];

        for (let i = 0; i < rawLines.length; i++) {
            const line = rawLines[i];
            const singleDandas = (line.replace(/॥/g, '').match(/।/g) || []).length;

            if (singleDandas >= 3) {
                const clauses = line
                    .split(/(?<=।)(?:\s+)/u)
                    .map(c => c.trim())
                    .filter(Boolean);

                if (clauses.length >= 3) {
                    formattedLines.push(clauses.slice(0, 2).join(' '));
                    formattedLines.push(clauses.slice(2).join(' '));
                    continue;
                }
            }
            formattedLines.push(line);
        }

        return formattedLines;
    }

    const clauses = normalized
        .split(/(?<=।)\s+|(?<=॥\s*[०-९0-9]+(?:-[०-९0-9]+)?\s*॥)\s*/u)
        .map(x => x.trim())
        .filter(Boolean);

    if (clauses.length <= 2) {
        return clauses;
    }

    const grouped = [];
    for (let i = 0; i < clauses.length; i += 2) {
        if (i + 1 < clauses.length) {
            grouped.push(clauses[i] + ' ' + clauses[i + 1]);
        } else {
            grouped.push(clauses[i]);
        }
    }

    return grouped;
}

// Split multi-stanza entry (Haripath) into separate ovis
function expandEntries(entries, workTitle) {
    if (!Array.isArray(entries)) return [];
    const isHaripath = String(workTitle || '').includes('हरिपाठ');
    const expanded = [];

    entries.forEach((entry, eIdx) => {
        const text = String(entry.text || '').trim();
        const stanzas = text.split(/(?<=॥\s*[०-९0-9]+\s*॥)\s*(?=\n|[^\s])/u).map(s => s.trim()).filter(Boolean);

        if (isHaripath && stanzas.length > 1) {
            stanzas.forEach((stanzaText, sIdx) => {
                let sNum = null;
                const m = stanzaText.match(/॥\s*([०-९0-9]+)\s*॥/u);
                if (m && m[1]) {
                    const devDigits = {'०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9'};
                    const stdNum = m[1].replace(/[०-९]/g, d => devDigits[d]);
                    sNum = parseInt(stdNum, 10);
                }
                expanded.push({
                    ...entry,
                    id: `${entry.id || 'hp'}-${sIdx + 1}`,
                    number: sNum !== null ? sNum : (sIdx + 1),
                    text: stanzaText,
                    meaning: entry.meaning || '',
                    teaching: entry.teaching || ''
                });
            });
        } else {
            expanded.push(entry);
        }
    });

    return expanded;
}

function topLevelWorks(saints) {
    return (saints || []).flatMap(saint =>
        (saint.works || []).map((work, index) => ({
            saint,
            work,
            index
        }))
    );
}

function formatSubTitle(title, parentTitle) {
    if (!title) return '';
    if (parentTitle && title.startsWith(parentTitle)) {
        return title.replace(new RegExp('^' + parentTitle + '\\s*[-—–]?\\s*', 'u'), '').trim() || title;
    }
    return title.replace(/^ज्ञानेश्वरी\s*[-—–]?\s*/u, '').trim();
}

function App() {
    const [saints, setSaints] = useState([]);
    const [view, setView] = useState('home');

    const [search, setSearch] = useState('');
    const [theme, setTheme] = useState(null);
    const [loading, setLoading] = useState(true);
    const [workLoading, setWorkLoading] = useState(false);
    const touchStart = useRef(null);
    const searchRef = useRef(null);

    useEffect(() => {
        async function loadData() {
            try {
                const ts = Date.now();
                const indexResponse = await fetch(DATA_BASE + 'index.json?v=' + ts);
                if (!indexResponse.ok) throw new Error('index.json fetch failed');
                const files = await indexResponse.json();

                const results = await Promise.allSettled(
                    files.map(async file => {
                        const response = await fetch(DATA_BASE + file + '?v=' + ts);
                        if (!response.ok) throw new Error(`${file} not found`);
                        return response.json();
                    })
                );

                const loaded = results
                    .filter(r => r.status === 'fulfilled' && r.value && r.value.id)
                    .map(r => r.value);

                setSaints(loaded);
            } catch (error) {
                console.error('Bhajasi Bharat data loading error:', error);
            } finally {
                setLoading(false);
            }
        }

        loadData();
    }, []);

    useEffect(() => {
        let pageTitle = 'भजसी भारत.com — संतवाणी | सार्थ संतसाहित्य, हरिपाठ, ज्ञानेश्वरी व अभंग चिंतन';

        if (view === 'reader' && selectedSaint && selectedWork) {
            pageTitle = `${selectedWork.title} (दिवस ${day}) — ${selectedSaint.name} | भजसी भारत.com`;
        } else if (view === 'subworks' && selectedParentWork) {

        } else if (view === 'works' && selectedSaint) {

    async function handleWorkClick(saint, work, parent = null) {
        if (!work) return;

        if (work.sections && work.sections.length > 0) {
            setSelectedSaint(saint);
            setSelectedParentWork(work);
            setSelectedWork(null);
            setView('subworks');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }

        if (work.file && (!work.entries || work.entries.length === 0)) {
            setWorkLoading(true);

                const ts = Date.now();
                const res = await fetch(DATA_BASE + work.file + '?v=' + ts);
                if (res.ok) {
                    const data = await res.json();
                    work.entries = data.entries || data;
                    if (data.days) work.days = data.days;
                    if (data.verses) work.verses = data.verses;
                }
            } catch (e) {
                console.error('Failed to load standalone work file:', work.file, e);
            } finally {
                setWorkLoading(false);
            }
        }

        openWork(saint, work, 1, parent);
    }

    function openWork(saint, work, initialDay = 1, parent = null) {
        if (!saint || !work) return;

        setSelectedSaint(saint);
        setSelectedParentWork(parent);
        setSelectedWork(work);

        const maxDay = Math.max(1, Number(work.days || 1));
        const safeDay = Math.min(Math.max(1, initialDay), maxDay);

        setDay(safeDay);

        writeProgress(makeWorkKey(saint, work), { day: safeDay });
        window.scrollTo({ top: 0, behavior: 'smooth' });

        writeProgress(makeWorkKey(selectedSaint, selectedWork), { day: next });
        window.scrollTo({ top: 0, behavior: 'smooth' });

    function previousDay() {
        if (day <= 1) return;

    function onTouchStart(event) {
        if (view !== 'reader') return;
        touchStart.current = event.changedTouches[0].clientX;
    }

    function onTouchEnd(event) {
        if (view !== 'reader' || touchStart.current === null) return;
        const end = event.changedTouches[0].clientX;
        const distance = end - touchStart.current;
        if (Math.abs(distance) < 55) return;

        if (distance < 0) {
            nextDay();
        } else {
            previousDay();
        }
        touchStart.current = null;

    /* -------------------------------------------------------
       REBUILT SNAP IMAGE GENERATOR
    ------------------------------------------------------- */
    async function shareVerseSnap(entry, index) {
        const saintTitle = selectedSaint ? selectedSaint.name : 'संतवाणी';
        const fullWorkTitle = selectedWork ? selectedWork.title : '';
        const verseLabel = getVerseLabel(entry, index); // e.g. ओवी २९

            chapterName = formatSubTitle(fullWorkTitle, selectedParentWork.title);
        } else if (fullWorkTitle.includes('—')) {
            const parts = fullWorkTitle.split('—');
            granthName = parts[0].trim();
            chapterName = parts[1].trim();

        // Header Line 1: Orange #e98006

            function wrapLines(text, font, maxWidth) {

                ctx.font = font;

                words.forEach(w => {

                        current = w;

                        current = test;
                    }
                });

                return lines;
            }

            const meaningLines = wrapLines(entry.meaning || '', '400 28px "Noto Sans Devanagari", sans-serif', contentWidth);

            calcHeight += 210;

            canvas.width = width;

            // Background

            // Outermost Outline with Rounded Corners (radius 24px)

            ctx.beginPath();
            if (ctx.roundRect) {

            // Watermark (Center)

                ctx.save();
                ctx.globalAlpha = 0.05;
                const watermarkSize = Math.min(width * 0.58, 520);
                const wmX = (width - watermarkSize) / 2;
                const wmY = (finalHeight - watermarkSize) / 2;

                ctx.drawImage(logoImg, padding, logoY, fLogoSize, fLogoSize);

            }

            // Footer Left Text
            ctx.textAlign = 'left';
            ctx.fillStyle = '#e98006';
            ctx.font = '700 25px "Noto Sans Devanagari", sans-serif';
            ctx.fillText('भजसी भारत.com', padding + fLogoSize + 14, logoY + 22);

            ctx.fillStyle = '#ffffff';
            ctx.font = '600 21px "Noto Sans Devanagari", sans-serif';
            ctx.fillText('निर्मिती आणि संकलन: भरत रासवे', width - padding, logoY + 22);

            ctx.fillStyle = '#30c5ad';
            ctx.font = '500 18px "Noto Sans Devanagari", sans-serif';
            ctx.fillText('वेबसाईटला भेट द्या: https://bhajasibharat.blogspot.com/', width - padding, logoY + 48);

            canvas.toBlob(async (blob) => {
                if (!blob) {
                    fallbackShareText(shareCaption);
                    return;
                }
                const fileName = `BhajasiBharat_${granthName}_${verseLabel.replace(/\s+/g, '')}.png`;
                const file = new File([blob], fileName, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'भजसी भारत.com',
                            text: shareCaption
                        });
                    } catch (err) {
                        if (err && err.name !== 'AbortError') fallbackShareText(shareCaption);
                    }
                } else {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = fileName;
                    a.click();
                    fallbackShareText(shareCaption);
                }
            }, 'image/png');

        } catch (e) {
            fallbackShareText(shareCaption);
        }
    }

    function fallbackShareText(text) {
        if (navigator.share) {
            navigator.share({ title: 'भजसी भारत.com', text: text }).catch(() => {});
        } else if (navigator.clipboard) {
            navigator.clipboard.writeText(text);
            alert('मजकूर कॉपी झाला आहे. आपण व्हॉट्सॲपवर पाठवू शकता.');
        } else {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
    }

    const filteredSaints = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return saints;
        return saints.filter(saint => {
            const content = [
                saint.name,
                saint.search,
                ...(saint.works || []).map(w => w.title)
            ].join(' ').toLowerCase();
            return content.includes(q);
        });
    }, [saints, search]);

    const searchSuggestions = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q || q.length < 2) return [];

        const results = [];

        saints.forEach(saint => {
            if (saint.name && saint.name.toLowerCase().includes(q)) {
                results.push({
                    type: 'saint',
                    title: saint.name,
                    sub: 'संत माहिती व ग्रंथसूची',
                    action: () => { setSearch(''); openSaint(saint); }
                });
            }

            (saint.works || []).forEach(work => {
                if (work.sections && work.sections.length > 0) {
                    if (work.title && work.title.toLowerCase().includes(q)) {
                        results.push({
                            type: 'work',
                            title: work.title,
                            sub: saint.name,
                            action: () => { setSearch(''); handleWorkClick(saint, work); }
                        });
                    }
                    work.sections.forEach(sec => {
                        if (sec.title && sec.title.toLowerCase().includes(q)) {
                            results.push({
                                type: 'subwork',
                                title: sec.title,
                                sub: `${work.title} • ${saint.name}`,
                                action: () => { setSearch(''); handleWorkClick(saint, sec, work); }
                            });
                        }
                        const expSecEntries = expandEntries(sec.entries || [], sec.title);
                        expSecEntries.forEach((entry, idx) => {
                            const full = `${entry.text || ''} ${entry.meaning || ''} ${entry.teaching || ''}`.toLowerCase();
                            if (full.includes(q)) {
                                results.push({
                                    type: 'verse',
                                    title: `${sec.title} (दिवस ${entry.day || 1}) ${getVerseLabel(entry, idx)}`,
                                    sub: String(entry.text || '').slice(0, 75) + '...',
                                    action: () => { setSearch(''); openWork(saint, sec, entry.day || 1, work); }
                                });
                            }
                        });
                    });
                } else {
                    if (work.title && work.title.toLowerCase().includes(q)) {
                        results.push({
                            type: 'work',
                            title: work.title,
                            sub: saint.name,
                            action: () => { setSearch(''); handleWorkClick(saint, work); }
                        });
                    }
                    const expWorkEntries = expandEntries(work.entries || [], work.title);
                    expWorkEntries.forEach((entry, idx) => {
                        const full = `${entry.text || ''} ${entry.meaning || ''} ${entry.teaching || ''}`.toLowerCase();
                        if (full.includes(q)) {
                            results.push({
                                type: 'verse',
                                title: `${work.title} (दिवस ${entry.day || 1}) ${getVerseLabel(entry, idx)}`,
                                sub: String(entry.text || '').slice(0, 75) + '...',
                                action: () => { setSearch(''); openWork(saint, work, entry.day || 1); }
                            });
                        }
                    });
                }
            });
        });

        return results.slice(0, 25);
    }, [saints, search]);

    const themes = [
        { title: 'नामस्मरण', keys: ['नाम', 'हरि', 'हरी', 'राम', 'कृष्ण', 'हरिपाठ'] },
        { title: 'भक्ती', keys: ['भक्ति', 'भक्त', 'देव', 'दैवत'] },
        { title: 'ज्ञान', keys: ['ज्ञान', 'विवेक', 'आत्म', 'तत्त्व'] },
        { title: 'समता', keys: ['समता', 'सर्व', 'एकत्व'] },
        { title: 'सेवा', keys: ['सेवा', 'दया', 'करुणा', 'परोपकार'] },

    const themeMatches = useMemo(() => {

        saints.forEach(saint => {
            (saint.works || []).forEach(work => {
                if (work.sections && work.sections.length > 0) {
                    work.sections.forEach(sec => {

                        if (theme.keys.some(k => secString.includes(k.toLowerCase()))) {
                            matches.push({
                                saint,
                                work: sec,
                                parentWork: work,
                                displayTitle: sec.title,
                                displaySub: `${work.title} • ${saint.name}`

                        }
                    });
                } else {
                    const workString = JSON.stringify(work).toLowerCase();
                    if (theme.keys.some(k => workString.includes(k.toLowerCase()))) {
                        matches.push({
                            saint,
                            work,
                            parentWork: null,
                            displayTitle: work.title,
                            displaySub: saint.name
                        });
                    }
                }
            });
        });

        return matches;
    }, [saints, theme]);

    const continueItems = [];
    saints.forEach(saint => {

            } else {

                if (saved) {

                        work,
                        parentWork: null,
                        day: Number(saved.day || 1)

                }
            }
        });
    });

    let currentEntries = [];

                <main className='bhajasi-main'>

                    {/* TODAY (CONTINUE READING) */}
                    {view === 'today' && (

                                <h2>आजचे वाचन</h2>

                                            onClick={() => openWork(item.saint, item.work, item.day, item.parentWork)}

                                        onClick={() => openSaint(saint)}
                                    >
                                        <div className='bhajasi-card-title'>{saint.name}</div>

                    {/* SUB-SECTIONS VIEW */}
                    {view === 'subworks' && selectedSaint && selectedParentWork && (

                                        {entry.teaching && (
                                            <div className='bhajasi-teaching'>
                                                <div className='bhajasi-teaching-title'>शिकवण</div>
                                                <p className='bhajasi-teaching-text'>{entry.teaching}</p>
                                            </div>
                                        )}
                                    </article>
                                ))
                            )}

                            {/* PAGER */}
                            <div className='bhajasi-reader-footer'>
                                <button
                                    className='bhajasi-pager'
                                    onClick={previousDay}
                                    disabled={day <= 1}
                                    aria-label='मागील दिवस'
                                    title='मागील दिवस'
                                >
                                    <i className='fa-solid fa-chevron-left'></i>
                                </button>
                                <button
                                    className='bhajasi-pager'
                                    onClick={nextDay}
                                    disabled={day >= totalDays}
                                    aria-label='पुढील दिवस'
                                    title='पुढील दिवस'
                                >
                                    <i className='fa-solid fa-chevron-right'></i>
                                </button>
                            </div>
                        </section>
                    )}

                    {/* THEMES VIEW */}
                    {view === 'theme' && theme && (
                        <section>
                            <div className='bhajasi-reader-head'>
                                <button className='bhajasi-back' onClick={goHome}>
                                    ← मुख्य पानावर परत
                                </button>
                                <div className='bhajasi-title-row'>
                                    <h2 className='bhajasi-title'>{theme.title}</h2>
                                </div>
                            </div>
                            <div className='bhajasi-grid'>
                                {themeMatches.length === 0 ? (
                                    <div className='bhajasi-empty'>या विषयाशी संबंधित साहित्य लवकरच उपलब्ध होईल.</div>
                                ) : (
                                    themeMatches.map((item, index) => (
                                        <button
                                            key={index}
                                            className='bhajasi-card'
                                            onClick={() => handleWorkClick(item.saint, item.work, item.parentWork)}
                                        >
                                            <div className='bhajasi-card-title'>{item.displayTitle}</div>
                                            <div className='bhajasi-card-sub'>{item.displaySub}</div>
                                        </button>
                                    ))
                                )}
                            </div>
                        </section>
                    )}

                    {/* GLOBAL FOOTER */}
                    {renderPageFooter()}
                </main>

                {/* BOTTOM NAVIGATION */}
                <nav className='bhajasi-bottom'>
                    <button
                        className={view === 'home' ? 'active' : ''}
                        onClick={goHome}
                    >
                        <span className='bhajasi-bottom-icon'><i className='fa-solid fa-house'/></span>
                        मुख्य
                    </button>
                    <button
                        className={view === 'saints' || view === 'works' || view === 'subworks' ? 'active' : ''}
                        onClick={goSaints}
                    >
                        <span className='bhajasi-bottom-icon'><i className='fa-solid fa-hands-praying'/></span>
                        संत
                    </button>
                    <button
                        className={view === 'today' ? 'active' : ''}
                        onClick={goToday}
                    >
                        <span className='bhajasi-bottom-icon'><i className='fa-solid fa-book-open'/></span>
                        आजचे
                    </button>
                </nav>
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('bhajasi-root'));
root.render(<App />);
//]]>
</script>
</body>
</html>
